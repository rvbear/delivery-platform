server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # test service 추후 삭제 예정
            - id: test-service
              uri: lb://test-service
              predicates:
                - Path=/api/test/**

            # auth service
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
