server:
  port: 8080


spring:
  application:
    name: api-gateway


  cloud:
    gateway:
      routes:
        - id: example-service
          uri: http://localhost:9000
          predicates:
            - Path=/example/**



eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka
